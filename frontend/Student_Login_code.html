<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Mindurr Systems Academy</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=geist:wght@100..900&family=inter:wght@100..900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "background": "#fcfae6",
                        "primary": "#785a00",
                        "on-surface": "#1c1917",
                        "on-surface-variant": "#44403c",
                        "surface": "#fefce8",
                        "surface-container-low": "#f6f4e1",
                        "primary-container": "#eab308",
                        "on-primary-container": "#604700",
                        "surface-container-highest": "#fde047"
                    },
                    fontFamily: {
                        "label-caps": ["inter"],
                        "headline-lg": ["geist"],
                        "body-md": ["inter"]
                    }
                }
            }
        };
    </script>
    <style>::-webkit-scrollbar { display: none; } .hidden { display: none; }</style>
</head>

<body class="bg-background font-body-md text-on-surface antialiased">

    <header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-md border-b border-gray-200/50">
        <div class="max-w-[1200px] mx-auto px-6 h-16 flex items-center justify-between">
            <a class="flex items-center gap-2 font-bold text-lg" href="#">Mindurr</a>
            <div id="user-header-info" class="hidden flex items-center gap-4">
                <span id="user-email-display" class="text-sm opacity-70"></span>
                <button onclick="handleLogout()" class="text-sm font-bold text-primary">Logout</button>
            </div>
        </div>
    </header>

    <main class="pt-24 min-h-screen flex flex-col items-center">

        <!-- AUTH CARD -->
        <div id="auth-section" class="w-full max-w-xl bg-surface rounded-xl p-8 shadow-md border border-gray-100">
            <div class="mb-8">
                <span class="text-[12px] font-bold text-primary tracking-widest uppercase block mb-1">Distributed Engine Access</span>
                <h1 id="auth-title" class="text-3xl font-extrabold">Student & Engineer Login</h1>
                <p id="auth-subtitle" class="text-on-surface-variant mt-2">Access your learning tracks and systems challenges.</p>
            </div>

            <!-- Social Buttons -->
            <div class="grid grid-cols-2 gap-3 mb-8">
                <button onclick="signInWithSocial('github')" class="flex items-center justify-center gap-2 py-2 bg-surface-container-low rounded-lg hover:bg-gray-200 transition-all text-[12px] font-bold uppercase tracking-wider">
                    GitHub
                </button>
                <button onclick="signInWithSocial('google')" class="flex items-center justify-center gap-2 py-2 bg-surface-container-low rounded-lg hover:bg-gray-200 transition-all text-[12px] font-bold uppercase tracking-wider">
                    Google
                </button>
            </div>

            <!-- Form -->
            <form id="auth-form" class="flex flex-col gap-5">
                <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-bold text-on-surface-variant uppercase">Email / Handle</label>
                    <input type="email" id="email" class="w-full p-3 bg-white border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-primary-container" placeholder="alex.dev@university.edu" required>
                </div>
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] font-bold text-on-surface-variant uppercase">Password</label>
                        <a href="#" class="text-xs text-primary">Forgot?</a>
                    </div>
                    <input type="password" id="password" class="w-full p-3 bg-white border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-primary-container" placeholder="••••••••••••" required>
                </div>
                
                <button type="submit" id="submit-btn" class="w-full py-4 bg-primary-container text-on-primary-container font-bold rounded-lg shadow-sm hover:shadow-md transition-all mt-2 uppercase text-[12px] tracking-widest">
                    Sign In to Learning Tracks
                </button>
            </form>

            <!-- FOOTER SECTION (The part you requested) -->
            <div class="mt-8 pt-6 border-t border-gray-200/60 flex flex-col sm:flex-row items-center justify-between gap-4 text-[14px] text-on-surface-variant">
                <div>
                    Don't have an account? 
                    <a href="javascript:void(0)" onclick="toggleAuthMode()" id="toggle-link" class="font-semibold text-on-surface hover:text-primary transition-colors underline ml-1">Start free track →</a>
                </div>
                <div>
                    <a class="text-primary hover:text-on-surface transition-colors flex items-center gap-1 font-medium" href="#">
                        <span>Switch to Recruiter Portal</span>
                        <span class="material-symbols-outlined text-[18px]">swap_horiz</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- DASHBOARD (Hidden) -->
        <div id="dashboard-section" class="hidden w-full max-w-4xl px-6">
            <h2 class="text-2xl font-bold mb-6">Active Learning Tracks</h2>
            <div id="tracks-list" class="grid gap-4">
                <!-- Data from Supabase will go here -->
            </div>
        </div>

    </main>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isSignUpMode = false;

        // --- 2. UI TOGGLES ---
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const submitBtn = document.getElementById('submit-btn');
            const toggleLink = document.getElementById('toggle-link');

            if (isSignUpMode) {
                title.innerText = "Create Your Account";
                submitBtn.innerText = "Register for Free Track";
                toggleLink.innerText = "Back to Login ←";
            } else {
                title.innerText = "Student & Engineer Login";
                submitBtn.innerText = "Sign In to Learning Tracks";
                toggleLink.innerText = "Start free track →";
            }
        }

        // --- 3. AUTH LOGIC ---
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUpMode) {
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) alert(error.message);
                else {
                    alert("Registration successful! Please check your email.");
                    window.location.href = 'assessment.html';
                }
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else checkUser();
            }
        });

        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        // --- 4. DATA LOGIC (Fetch & Edit) ---
        async function fetchAndRenderTracks() {
            const { data: tracks, error } = await supabase.from('learning_tracks').select('*');
            const list = document.getElementById('tracks-list');
            list.innerHTML = '';

            if (tracks) {
                tracks.forEach(track => {
                    const item = document.createElement('div');
                    item.className = "bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between";
                    item.innerHTML = `
                        <input type="text" value="${track.name}" class="font-bold bg-transparent border-b border-transparent focus:border-primary outline-none" 
                            onchange="updateTrack(${track.id}, 'name', this.value)">
                        <div class="flex items-center gap-4">
                            <span class="text-sm text-gray-400">Progress:</span>
                            <input type="number" value="${track.progress}" class="w-12 font-bold" 
                                onchange="updateTrack(${track.id}, 'progress', this.value)">%
                        </div>
                    `;
                    list.appendChild(item);
                });
            }
        }

        async function updateTrack(id, field, value) {
            await supabase.from('learning_tracks').update({ [field]: value }).eq('id', id);
            console.log("Database updated");
        }

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                const { data: profile } = await supabase
                    .from('skill_profiles')
                    .select('id')
                    .eq('user_id', user.id)
                    .single();

                if (profile) {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    document.getElementById('user-header-info').classList.remove('hidden');
                    document.getElementById('user-email-display').innerText = user.email;
                    fetchAndRenderTracks();
                } else {
                    window.location.href = 'assessment.html';
                }
            }
        }

        checkUser();
    </script>
</body>
</html>
