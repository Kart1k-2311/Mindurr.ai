<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindurr.ai | Sign In &amp; Create Account</title>

    <!-- Google Fonts: Geist (display), Inter (body) per Design.md -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Material Symbols Outlined (icon system used across the app) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- (optional) social icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>

    <style>
        /* ==========================================================
           SOLARIS DESIGN SYSTEM TOKENS (Design.md)
           Sun-Bleached Paper palette · Geist/Inter · 4px rhythm
           ========================================================== */
        :root {
            --surface: #fefce8;
            --surface-dim: #fef9c3;
            --surface-bright: #fffdf2;
            --surface-container-low: #f6f4e1;
            --surface-white: #ffffff;

            --on-surface: #1c1917;
            --on-surface-variant: #44403c;

            --primary: #eab308;
            --on-primary: #422006;
            --primary-container: #fef08a;
            --on-primary-container: #713f12;
            --primary-hover: #dfa806;
            --secondary: #885123;
            --tertiary: #00658e;

            --outline: #a8a29e;
            --outline-variant: #d6d3d1;

            --inverse-surface: #313124;
            --inverse-on-surface: #f3f2de;

            --error: #ba1a1a;

            --font-display: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
            --radius-pill: 9999px;

            --shadow-sm: 0 2px 8px -1px rgba(66, 32, 6, 0.05);
            --shadow-md: 0 8px 24px -4px rgba(66, 32, 6, 0.09);
            --shadow-lg: 0 16px 36px -6px rgba(66, 32, 6, 0.16);

            /* Warm ambient glow for the page background */
            --aurora-primary: rgba(254, 240, 138, 0.55);
            --aurora-secondary: rgba(234, 179, 8, 0.22);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            color: var(--on-surface);
            background-color: var(--surface);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient sun-bleached aura behind the card */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(900px, 94vw);
            height: min(700px, 90vh);
            background: radial-gradient(
                ellipse at center,
                var(--aurora-primary) 0%,
                var(--aurora-secondary) 45%,
                rgba(252, 250, 230, 0) 72%
            );
            filter: blur(52px);
            pointer-events: none;
            z-index: 0;
        }

        /* Subtle 4px grid texture (technical precision) */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(66, 32, 6, 0.035) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--on-surface);
            margin: 0;
        }

        p {
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: 0.01em;
            color: var(--on-surface-variant);
            margin: 20px 0 30px;
        }

        span {
            font-size: 12px;
            color: var(--on-surface-variant);
        }

        a {
            color: var(--secondary);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            margin: 15px 0;
            transition: color 0.15s ease;
        }

        a:hover {
            color: var(--on-primary-container);
        }

        button {
            border-radius: var(--radius-pill);
            border: none;
            background-color: var(--primary);
            color: var(--on-primary);
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 700;
            padding: 13px 45px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: transform 80ms ease-in, background-color 0.18s ease, box-shadow 0.18s ease;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(66, 32, 6, 0.12);
        }

        button:hover {
            background-color: var(--primary-hover);
            box-shadow: var(--shadow-md);
        }

        button:active {
            transform: scale(0.95);
        }

        button:focus {
            outline: none;
        }

        button.ghost {
            background-color: transparent;
            color: var(--inverse-on-surface);
            border: 1px solid var(--inverse-on-surface);
        }

        button.ghost:hover {
            background-color: rgba(243, 242, 222, 0.12);
            box-shadow: none;
        }

        input {
            background-color: var(--surface-container-low);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--on-surface);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input::placeholder {
            color: var(--on-surface-variant);
            opacity: 0.7;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.25);
        }

        .container {
            background-color: var(--surface-bright);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--outline-variant);
            position: relative;
            overflow: hidden;
            width: 768px;
            max-width: 100%;
            min-height: 500px;
            z-index: 1;
        }

        form {
            background-color: var(--surface-bright);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        .social-container {
            margin: 20px 0;
        }

        .social-container a {
            border: 1px solid var(--outline-variant);
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            height: 40px;
            width: 40px;
            color: var(--on-surface-variant);
            transition: all 0.15s ease;
        }

        .social-container a:hover {
            border-color: var(--primary);
            color: var(--on-primary-container);
            background-color: var(--primary-container);
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        /* Sign in (left, visible initially) */
        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        /* Sign up (hidden initially) */
        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        /* Activate sign up */
        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%,
            49.99% {
                opacity: 0;
                z-index: 1;
            }

            50%,
            100% {
                opacity: 1;
                z-index: 5;
            }
        }

        /* Overlay part — Sunflower gradient (Solaris brand accent) */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        .overlay {
            background: linear-gradient(to right, var(--primary), var(--primary-hover));
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0 0;
            color: var(--on-primary);
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left {
            transform: translateX(-20%);
        }

        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }

        .overlay h1 {
            color: var(--on-primary);
            font-weight: 800;
        }

        .overlay p {
            color: var(--on-primary);
            opacity: 0.85;
        }

        .overlay .ghost {
            color: var(--on-primary);
            border-color: var(--on-primary);
        }

        .overlay .ghost:hover {
            background-color: rgba(66, 32, 6, 0.12);
        }

        /* Brand mark inside the card */
        .brand-row {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            text-decoration: none;
        }

        .brand-row .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-md);
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(113, 63, 18, 0.18);
            flex-shrink: 0;
        }

        .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        }

        .brand-row .brand-name {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--on-surface);
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 6px;
        }

        @media (max-width: 640px) {
            body {
                padding: 16px;
                overflow-y: auto;
            }

            .container {
                min-height: 520px;
            }

            form {
                padding: 0 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- SIGN UP -->
        <div class="form-container sign-up-container">
            <form id="signupFormLR">
                <a class="brand-row" href="index.html" title="Back to Mindurr.ai">
                    <span class="brand-mark">
                        <img alt="Logo" class="h-8" src="https://lh3.googleusercontent.com/aida/AEtjO1WDIAPkESI4CESJlDpCsgV85FvjOok_N6FYqfMVVUOE5szeOWZ_4FWLqIT67KXNnA1Tl3ZnWijMca6VYZ20OfzKRo83lzr8rMX0ZFCQkJ-KkoluaeFQhazjOO_Xhcgmu-l1tHpfJgx8c3Jjc_XJjk__i3n0egyZF8sneCFdz1vjfBQXv0W9KdfXGmQn4hBsOwBV8IjSbUazGz6_aDhlSiICAVklT66XynlmDiOOYjactuqYDrjkU-kGlPo">
                    </span>
                    <span class="brand-name">Mindurr.ai</span>
                </a>
                <h1>Create Account</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>or use your email for registration</span>
                <input id="signupName" type="text" placeholder="Name" required />
                <input id="signupEmail" type="email" placeholder="Email" required />
                <input id="signupPassword" type="password" placeholder="Password" required />
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <!-- SIGN IN -->
        <div class="form-container sign-in-container">
            <form id="loginFormLR">
                <a class="brand-row" href="index.html" title="Back to Mindurr.ai">
                    <span class="brand-mark">
                        <img alt="Logo" class="h-8" src="https://lh3.googleusercontent.com/aida/AEtjO1WDIAPkESI4CESJlDpCsgV85FvjOok_N6FYqfMVVUOE5szeOWZ_4FWLqIT67KXNnA1Tl3ZnWijMca6VYZ20OfzKRo83lzr8rMX0ZFCQkJ-KkoluaeFQhazjOO_Xhcgmu-l1tHpfJgx8c3Jjc_XJjk__i3n0egyZF8sneCFdz1vjfBQXv0W9KdfXGmQn4hBsOwBV8IjSbUazGz6_aDhlSiICAVklT66XynlmDiOOYjactuqYDrjkU-kGlPo">
                    </span>
                    <span class="brand-name">Mindurr.ai</span>
                </a>
                <span class="eyebrow"> <span>
                <h1>Sign In</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>or use your account</span>
                <input id="loginEmail" type="email" placeholder="Email" required />
                <input id="loginPassword" type="password" placeholder="Password" required />
                <a href="#">Forgot your password?</a>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <!-- OVERLAY -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Mindurr!</h1>
                    <p>Enter your personal details and start your journey with us</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("container");
        const signUpButton = document.getElementById("signUp");
        const signInButton = document.getElementById("signIn");

        // Overlay toggle
        if (signUpButton && signInButton && container) {
            signUpButton.addEventListener("click", () => {
                container.classList.add("right-panel-active");
            });

            signInButton.addEventListener("click", () => {
                container.classList.remove("right-panel-active");
            });
        }

        // ?mode=signup -> open signup panel
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("mode") === "signup" && container) {
            container.classList.add("right-panel-active");
        }

        // Handle LOGIN
        const loginForm = document.getElementById("loginFormLR");
        if (loginForm) {
            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const payload = {
                    email: document.getElementById("loginEmail").value.trim(),
                    password: document.getElementById("loginPassword").value.trim()
                };

                try {
                    const res = await fetch("/api/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    const json = await res.json();
                    if (res.ok) {
                        alert("Login successful!");
                        window.location.href = "/"; // back to home
                    } else {
                        alert(json.error || "Login failed");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Network error");
                }
            });
        }

        // Handle SIGNUP
        const signupForm = document.getElementById("signupFormLR");
        if (signupForm) {
            signupForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const payload = {
                    name: document.getElementById("signupName").value.trim(),
                    email: document.getElementById("signupEmail").value.trim(),
                    password: document.getElementById("signupPassword").value.trim()
                };

                try {
                    const res = await fetch("/api/signup", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    const json = await res.json();
                    if (res.ok) {
                        alert("Account created!");
                        window.location.href = "/"; // return home logged in
                    } else {
                        alert(json.error || "Signup failed");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Network error");
                }
            });
        }
    });
    </script>
</body>
</html>
