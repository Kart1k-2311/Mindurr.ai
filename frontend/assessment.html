    <style>
        ::-webkit-scrollbar { display: none; }
        .hidden { display: none !important; }
        .step-card { transition: all 0.25s ease; cursor: pointer; }
        .step-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -4px rgba(66, 32, 6, 0.09); }
        .step-card.selected { border-color: #eab308; background-color: #fef9c3; }
        .progress-fill { transition: width 0.4s ease; }
        .btn-primary {
            background-color: #eab308; color: #422006; font-weight: 700;
            padding: 10px 28px; border-radius: 9999px; font-size: 13px;
            text-transform: uppercase; letter-spacing: 0.05em;
            transition: all 0.15s ease; border: none; cursor: pointer;
        }
        .btn-primary:hover { background-color: #dfa806; box-shadow: 0 4px 12px rgba(66, 32, 6, 0.15); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background-color: transparent; color: #44403c; font-weight: 700;
            padding: 10px 28px; border-radius: 9999px; font-size: 13px;
            text-transform: uppercase; letter-spacing: 0.05em;
            border: 1px solid #d6d3d1; cursor: pointer; transition: all 0.15s ease;
        }
        .btn-secondary:hover { background-color: #f6f4e1; }
        .config-message { grid-column: 1 / -1; }
    </style>
</head>
<body class="bg-background font-body text-on-surface antialiased min-h-screen">

<main class="pt-24 pb-16 min-h-screen flex flex-col items-center px-6">
    <div class="w-full max-w-2xl">
        <!-- Header -->
        <div class="text-center mb-10">
            <span class="text-[11px] font-bold text-primary tracking-widest uppercase block mb-2">Skill Profiling</span>
            <h1 class="text-3xl font-extrabold tracking-tight" id="wizard-title">Select Your Industry</h1>
            <p class="text-on-surface-variant mt-2 text-sm" id="wizard-subtitle">Choose the field you want to be assessed in.</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-outline-variant/30 rounded-full h-2 mb-10">
            <div class="bg-primary-container h-2 rounded-full progress-fill" id="progress-bar" style="width: 25%"></div>
        </div>

        <!-- Steps -->
        <div id="step-1" class="step-content">
            <div class="grid grid-cols-2 gap-4" id="industry-grid"></div>
            <div class="hidden mt-6" id="goal-section">
                <p class="text-xs font-bold text-primary uppercase tracking-widest mb-3 text-center">Choose Your Assessment Goal</p>
                <div class="grid grid-cols-1 gap-3" id="goal-grid"></div>
            </div>
        </div>
        <div id="step-2" class="step-content hidden">
            <div class="grid grid-cols-2 gap-3" id="language-grid"></div>
            <p class="text-xs text-on-surface-variant mt-4 text-center">Select at least one language you know.</p>
        </div>
        <div id="step-3" class="step-content hidden">
            <div class="grid grid-cols-2 gap-3" id="tech-grid"></div>
            <p class="text-xs text-on-surface-variant mt-4 text-center">Select at least one technology you're familiar with.</p>
        </div>
        <div id="step-4" class="step-content hidden">
            <div id="assessment-container"></div>
            <div class="flex justify-between items-center mt-6">
                <span class="text-sm text-on-surface-variant" id="question-counter">Question 1 of 25</span>
                <span class="text-sm font-bold text-primary" id="score-live">Score: 0/0</span>
            </div>
        </div>
        <div id="step-results" class="step-content hidden"></div>

        <!-- Navigation -->
        <div class="flex justify-between mt-10" id="nav-buttons">
            <button class="btn-secondary hidden" id="prev-btn">Back</button>
            <button class="btn-primary ml-auto" id="next-btn" disabled>Next</button>
        </div>
    </div>
</main>

let state = { step: 1, industry: null, goal: null, languages: [], technologies: [], currentQuestion: null, questionIndex: 0, totalQuestions: 0, questionIds: [], hasNext: false, answers: {}, scores: {}, totalScore: 0, assessmentId: null, result: null };

function showToast(message, type) {
    const colors = { info: 'bg-inverse-surface', error: 'bg-red-700', success: 'bg-green-700' };
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-6 right-6 ' + (colors[type] || colors.info) + ' text-white px-5 py-3 rounded-xl text-sm font-bold shadow-lg z-50 transition-opacity';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { toast.remove(); }, 300); }, 3000);
}

function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, function(character) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character];
    });
}

async function getAccessToken() {
    var result = await getSupabaseClient().auth.getSession();
    var session = result.data && result.data.session;
    if (result.error || !session || !session.access_token) {
        showToast('Your session has expired. Please sign in again.', 'error');
        window.location.href = 'login_register.html?role=student';
        throw new Error('Authentication required');
    }
    return session.access_token;
}

function getSupabaseClient() {
    if (!supabaseClient) {
        if (!window.supabase || typeof window.supabase.createClient !== 'function') {
            throw new Error('Authentication library failed to load.');
        }
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    return supabaseClient;
}

async function apiFetch(path, options) {
    options = options || {};
    var token = await getAccessToken();
    var headers = Object.assign({
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
    }, options.headers || {});
    var response;

    try {
        response = await fetch(API_BASE_URL + path, Object.assign({}, options, { headers: headers }));
    } catch (error) {
        throw new Error('Unable to reach the assessment service. Check that the backend is running.');
    }

    var data = await response.json().catch(function() { return {}; });
    if (response.status === 401) {
        showToast('Your session has expired. Please sign in again.', 'error');
        window.location.href = 'login_register.html?role=student';
        throw new Error('Authentication required');
    }
    if (!response.ok) {
        var detail = data.detail || data.error || 'The request failed (' + response.status + ')';
        throw new Error(typeof detail === 'string' ? detail : 'The request failed.');
    }
    return data;
}

function renderIndustries() {
    var grid = document.getElementById('industry-grid');
    var entries = Object.entries(INDUSTRIES);
    if (!grid || entries.length === 0) {
        if (grid) grid.innerHTML = '<p class="config-message text-center text-on-surface-variant text-sm py-8">Unable to load industries. Please try again.</p>';
        return;
    }

    grid.innerHTML = entries.map(function(entry) {
        var key = entry[0], ind = entry[1];
        return '<button data-industry="' + key + '" class="step-card text-left p-5 rounded-xl border-2 border-outline-variant/40 bg-surface-container-lowest hover:border-primary-container transition-all">' +
            '<span class="material-symbols-outlined text-primary text-2xl mb-2">' + ind.icon + '</span>' +
            '<h3 class="font-bold text-on-surface">' + ind.label + '</h3>' +
            '<p class="text-xs text-on-surface-variant mt-1">' + ind.desc + '</p>' +
        '</button>';
    }).join('');

    grid.querySelectorAll('button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            grid.querySelectorAll('button').forEach(function(b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
            state.industry = btn.dataset.industry;
            state.goal = null;
            renderGoals();
            document.getElementById('next-btn').disabled = true;
        });
    });
}

        grid.innerHTML = '<p class="config-message text-center text-on-surface-variant text-sm py-4">No assessment goals are available for this industry.</p>';

async function loadQuestion(index) {
    var container = document.getElementById('assessment-container');
    var nextBtn = document.getElementById('next-btn');
    state.questionIndex = index;
    state.currentQuestion = null;
    nextBtn.disabled = true;
    nextBtn.textContent = 'Loading...';
    container.innerHTML =
        '<div class="text-center py-16">' +
            '<div class="inline-block w-10 h-10 border-4 border-primary-container border-t-transparent rounded-full animate-spin mb-4"></div>' +
            '<p class="text-on-surface-variant text-sm font-bold">Loading question...</p>' +
        '</div>';

    try {
        if (!state.assessmentId) {
            var started = await apiFetch('/api/assessments', {
                method: 'POST',
                body: JSON.stringify({
                    industry: state.industry,
                    goal: state.goal,
                    languages: state.languages,
                    technologies: state.technologies
                })
            });
            state.assessmentId = started.assessment_id;
        }

        var data = await apiFetch('/api/assessments/' + encodeURIComponent(state.assessmentId) + '/questions?question_index=' + index);
        state.currentQuestion = data.question;
        state.questionIndex = data.question_index;
        state.totalQuestions = data.total_questions;
        state.hasNext = data.has_next;
        state.questionIds[index] = data.question.id;
        renderQuestion();
    } catch (error) {
        nextBtn.disabled = true;
        nextBtn.textContent = 'Next Question';
        container.innerHTML = '<div class="text-center py-12"><p class="text-on-surface-variant">Unable to load this question. <button onclick="loadQuestion(' + index + ')" class="text-primary font-bold underline">Try again</button></p></div>';
        showToast('Failed to load question: ' + error.message, 'error');
    }
}

async function buildAssessment() {
    state.currentQuestion = null;
    state.questionIndex = 0;
    state.totalQuestions = 0;
    state.questionIds = [];
    state.hasNext = false;
    state.answers = {};
    state.result = null;
    document.getElementById('step-4').classList.remove('hidden');
    document.getElementById('step-results').classList.add('hidden');

    var container = document.getElementById('assessment-container');
    container.innerHTML =
        '<div class="text-center py-16">' +
            '<div class="inline-block w-10 h-10 border-4 border-primary-container border-t-transparent rounded-full animate-spin mb-4"></div>' +
            '<p class="text-on-surface-variant text-sm font-bold">Generating your assessment...</p>' +
            '<p class="text-on-surface-variant text-xs mt-1">This may take a moment</p>' +
        '</div>';
    document.getElementById('question-counter').textContent = 'Loading...';
    document.getElementById('score-live').textContent = '';

    await loadQuestion(0);
}

function renderQuestion() {
    var container = document.getElementById('assessment-container');
    var nextBtn = document.getElementById('next-btn');
    var idx = state.questionIndex;
    var total = state.totalQuestions;
    var q = state.currentQuestion;
    if (!q) return;
    document.getElementById('question-counter').textContent = 'Question ' + (idx + 1) + ' of ' + total;
    document.getElementById('score-live').textContent = 'Answered: ' + Object.keys(state.answers).length + '/' + total;

    container.innerHTML =
        '<div class="mb-4">' +
            '<span class="text-[10px] font-bold text-tertiary uppercase tracking-widest">' + escapeHtml(q.technology) + '</span>' +
            '<h3 class="text-lg font-bold mt-1">' + escapeHtml(q.q) + '</h3>' +
        '</div>' +
        '<div class="flex flex-col gap-3">' +
            q.options.map(function(opt, i) {
                return '<button data-idx="' + i + '" class="step-card text-left p-4 rounded-xl border-2 border-outline-variant/40 bg-surface-container-lowest hover:border-primary-container transition-all text-sm">' + escapeHtml(opt) + '</button>';
            }).join('') +
        '</div>';

    container.querySelectorAll('button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            if (state.answers[idx]) return;
            var answerIdx = parseInt(btn.dataset.idx);
            state.answers[idx] = { question_id: q.id, answer: answerIdx };

            container.querySelectorAll('button').forEach(function(b) {
                b.disabled = true;
                if (parseInt(b.dataset.idx) === answerIdx) b.classList.add('selected');
            });
            nextBtn.disabled = false;
            nextBtn.textContent = state.hasNext ? 'Next Question' : 'Submit Answers';
        });
    });
    nextBtn.disabled = !state.answers[idx];
    nextBtn.textContent = state.hasNext ? 'Next Question' : 'Submit Answers';
}

function showResults() {
    document.getElementById('step-4').classList.add('hidden');
    document.getElementById('step-results').classList.remove('hidden');
    document.getElementById('nav-buttons').classList.add('hidden');

    var container = document.getElementById('step-results');
    container.innerHTML =
        '<div class="text-center mb-8">' +
            '<span class="material-symbols-outlined text-primary text-5xl mb-4">task_alt</span>' +
            '<h2 class="text-2xl font-extrabold">Your Answers Are Ready</h2>' +
            '<p class="text-on-surface-variant mt-2">Submit your answers to calculate your verified result.</p>' +
        '</div>' +
        '<div class="bg-surface-container-lowest rounded-xl p-6 border border-outline-variant/30 mb-6">' +
            '<div class="text-center">' +
                '<span class="text-3xl font-extrabold text-primary">' + state.totalQuestions + ' questions</span>' +
                '<p class="text-sm text-on-surface-variant mt-1">Ready for server-side scoring</p>' +
            '</div>' +
        '</div>' +
        '<div class="text-center mt-8">' +
            '<button onclick="submitAssessment()" class="btn-primary" id="save-btn">Save Profile & Continue</button>' +
        '</div>';
}

function renderResults(data) {
    var result = data.result || {};
    var scores = result.technology_scores || {};
    var totalScore = Math.round(Number(data.score !== undefined ? data.score : result.overall_score || 0));
    state.scores = scores;
    state.totalScore = totalScore;

    var container = document.getElementById('step-results');
    container.innerHTML =
        '<div class="text-center mb-8">' +
            '<span class="material-symbols-outlined text-primary text-5xl mb-4">emoji_events</span>' +
            '<h2 class="text-2xl font-extrabold">Assessment Complete!</h2>' +
            '<p class="text-on-surface-variant mt-2">Here\'s your skill profile.</p>' +
        '</div>' +
        '<div class="bg-surface-container-lowest rounded-xl p-6 border border-outline-variant/30 mb-6">' +
            '<div class="text-center">' +
                '<span class="text-5xl font-extrabold text-primary">' + totalScore + '%</span>' +
                '<p class="text-sm text-on-surface-variant mt-1">Overall Score</p>' +
            '</div>' +
        '</div>' +
        '<div class="space-y-3">' +
            Object.entries(scores).map(function(entry) {
                var tech = entry[0], score = Number(entry[1]);
                return '<div class="flex items-center justify-between p-3 bg-surface-container-low rounded-lg">' +
                    '<span class="font-bold text-sm">' + escapeHtml(tech) + '</span>' +
                    '<div class="flex items-center gap-3">' +
                        '<div class="w-24 h-2 bg-outline-variant/30 rounded-full overflow-hidden">' +
                            '<div class="h-full bg-primary-container rounded-full" style="width: ' + score + '%"></div>' +
                        '</div>' +
                        '<span class="text-sm font-bold text-on-surface-variant w-10 text-right">' + score + '%</span>' +
                    '</div>' +
                '</div>';
            }).join('') +
        '</div>' +
        '<div class="text-center mt-8">' +
            '<button onclick="continueAfterSave()" class="btn-primary" id="save-btn">Save Profile & Continue</button>' +
        '</div>';
}

async function submitAssessment() {
    var btn = document.getElementById('save-btn');
    if (!btn || !state.assessmentId) return;
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
        var answers = state.questionIds.map(function(questionId, index) {
            return { question_id: questionId, answer: state.answers[index].answer };
        });
        await apiFetch('/api/assessments/' + encodeURIComponent(state.assessmentId) + '/answers', {
            method: 'POST',
            body: JSON.stringify({ answers: answers })
        });
        state.result = await apiFetch('/api/assessments/' + encodeURIComponent(state.assessmentId) + '/result');
        renderResults(state.result);
        showToast('Assessment saved!', 'success');
    } catch (error) {
        showToast('Failed to submit answers: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Save Profile & Continue';
    }
}

function continueAfterSave() {
    window.location.href = 'index.html';
}

function goToStep(step) {
    document.querySelectorAll('.step-content').forEach(function(el) { el.classList.add('hidden'); });
    document.getElementById('step-' + step).classList.remove('hidden');

    var titles = {
        1: ['Select Your Industry', 'Choose the field you want to be assessed in.'],
        2: ['Select Languages', 'Pick the programming languages you know.'],
        3: ['Select Technologies', 'Choose frameworks and tools you\'re familiar with.'],
        4: ['Take Assessment', 'Answer questions about your selected technologies.']
    };

    document.getElementById('wizard-title').textContent = titles[step][0];
    document.getElementById('wizard-subtitle').textContent = titles[step][1];
    document.getElementById('progress-bar').style.width = (step * 25) + '%';

    var nextBtn = document.getElementById('next-btn');
    var prevBtn = document.getElementById('prev-btn');
    prevBtn.classList.toggle('hidden', step === 1 || step === 4);
    nextBtn.disabled = true;
    if (step === 3) {
        nextBtn.textContent = 'Start Assessment';
        document.getElementById('nav-buttons').classList.remove('hidden');
    } else if (step === 4) {
        nextBtn.textContent = 'Next Question';
        document.getElementById('nav-buttons').classList.remove('hidden');
    } else {
        nextBtn.textContent = 'Next';
        document.getElementById('nav-buttons').classList.remove('hidden');
    }
}

document.getElementById('next-btn').addEventListener('click', function() {
    if (state.step === 4) {
        if (!state.answers[state.questionIndex]) {
            showToast('Please select an answer first', 'error');
            return;
        }
        if (state.hasNext) loadQuestion(state.questionIndex + 1);
        else showResults();
        return;
    }
    if (state.step === 1 && !state.industry) { showToast('Please select an industry', 'error'); return; }
    if (state.step === 1 && !state.goal) { showToast('Please select an assessment goal', 'error'); return; }
    if (state.step === 2 && state.languages.length === 0) { showToast('Please select at least one language', 'error'); return; }
    if (state.step === 3 && state.technologies.length === 0) { showToast('Please select at least one technology', 'error'); return; }

    if (state.step === 1) { state.step = 2; renderLanguages(); }
    else if (state.step === 2) { state.step = 3; renderTechnologies(); }
    else if (state.step === 3) { state.step = 4; state.assessmentId = null; buildAssessment(); }
    goToStep(state.step);
});

document.getElementById('prev-btn').addEventListener('click', function() {
    state.step--;
    goToStep(state.step);
    if (state.step === 1) document.getElementById('next-btn').disabled = !state.industry;
    else if (state.step === 2) document.getElementById('next-btn').disabled = state.languages.length === 0;
    else if (state.step === 3) document.getElementById('next-btn').disabled = state.technologies.length === 0;
});

async function init() {
    if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
        showToast('Set your Supabase credentials in assessment.html', 'error');
        return;
    }
    try {
        var result = await getSupabaseClient().auth.getUser();
        var user = result.data && result.data.user;
        if (result.error || !user) { window.location.href = 'login_register.html?role=student'; return; }
    } catch (error) {
        showToast('Unable to verify your session. Please sign in again.', 'error');
        setTimeout(function() { window.location.href = 'login_register.html?role=student'; }, 800);
    }
}

try {
    renderIndustries();
} catch (error) {
    var industryGrid = document.getElementById('industry-grid');
    if (industryGrid) industryGrid.innerHTML = '<p class="config-message text-center text-on-surface-variant text-sm py-8">Unable to load industries. Please try again.</p>';
    showToast('Unable to load assessment options.', 'error');
}
init();
</script>
</body>
</html>
