<header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/30">

<main class="pt-24 pb-16 min-h-screen flex flex-col items-center px-6">
    <div class="w-full max-w-2xl">

        </div>

        <div class="w-full bg-outline-variant/30 rounded-full h-2 mb-10">
            <div class="bg-primary-container h-2 rounded-full progress-fill" id="progress-bar" style="width: 25%"></div>
        </div>

        <div id="step-1" class="step-content">
            <div class="grid grid-cols-2 gap-4" id="industry-grid"></div>
        </div>
        <div id="step-2" class="step-content hidden">
            <div class="grid grid-cols-2 gap-4" id="goal-grid"></div>
        </div>
        <div id="step-3" class="step-content hidden">

        <div id="step-4" class="step-content hidden">

            <div class="flex justify-between items-center mt-6">

                <span class="text-sm font-bold text-primary" id="score-live">Score: 0/0</span>
            </div>
        </div>
        <div id="step-results" class="step-content hidden"></div>

        <div class="flex justify-between mt-10" id="nav-buttons">
            <button class="btn-secondary hidden" id="prev-btn">Back</button>
            <button class="btn-primary ml-auto" id="next-btn" disabled>Next</button>
        </div>
    </div>
</main>

// Aliases for goals
QUESTION_BANK.full_stack = QUESTION_BANK.fullstack;

let state = { step: 1, industry: null, goal: null, technologies: [], questions: [], answers: {}, scores: {}, totalScore: 0 };

function showToast(message, type) {
    const colors = { info: 'bg-inverse-surface', error: 'bg-red-700', success: 'bg-green-700' };
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-6 right-6 ' + (colors[type] || colors.info) + ' text-white px-5 py-3 rounded-xl text-sm font-bold shadow-lg z-50 transition-opacity';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { toast.remove(); }, 300); }, 3000);
}

function renderIndustries() {
    var grid = document.getElementById('industry-grid');
    grid.innerHTML = Object.entries(INDUSTRIES).map(function([key, ind]) {
        return `<button data-industry="${key}" class="step-card text-left p-5 rounded-xl border-2 border-outline-variant/40 bg-surface-container-lowest hover:border-primary-container transition-all">
            <span class="material-symbols-outlined text-primary text-2xl mb-2">${ind.icon}</span>
            <h3 class="font-bold text-on-surface">${ind.label}</h3>
            <p class="text-xs text-on-surface-variant mt-1">${ind.desc}</p>
        </button>`;
    }).join('');

    grid.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
            grid.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            state.industry = btn.dataset.industry;
            document.getElementById('next-btn').disabled = false;
        });
    });
}

function renderGoals() {
    var grid = document.getElementById('goal-grid');
    grid.innerHTML = Object.entries(GOALS).map(function([key, goal]) {
        return `<button data-goal="${key}" class="step-card text-left p-5 rounded-xl border-2 border-outline-variant/40 bg-surface-container-lowest hover:border-primary-container transition-all">
            <span class="material-symbols-outlined text-primary text-2xl mb-2">${goal.icon}</span>
            <h3 class="font-bold text-on-surface">${goal.label}</h3>
            <p class="text-xs text-on-surface-variant mt-1">${goal.desc}</p>
        </button>`;
    }).join('');

    grid.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
            grid.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            state.goal = btn.dataset.goal;
            document.getElementById('next-btn').disabled = false;
        });
    });
}

function renderTechnologies() {
    var grid = document.getElementById('tech-grid');
    var techs = GOALS[state.goal].techs;

    grid.innerHTML = techs.map(function(tech) {
        return `<button data-tech="${tech}" class="step-card text-left p-4 rounded-xl border-2 border-outline-variant/40 bg-surface-container-lowest hover:border-primary-container transition-all">
            <h3 class="font-bold text-on-surface text-sm">${tech}</h3>
        </button>`;
    }).join('');

    grid.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
            btn.classList.toggle('selected');
            state.technologies = Array.from(grid.querySelectorAll('.selected')).map(b => b.dataset.tech);
            document.getElementById('next-btn').disabled = state.technologies.length === 0;
        });
    });
}

function loadHardcodedQuestions() {
    state.questions = [];
    state.answers = {};
    
    // Read directly from QUESTION_BANK for the specific selected goal
    const rawGoal = (state.goal || "frontend").toLowerCase().replace(/\s+/g, "_");
    const goalQuestions = QUESTION_BANK[rawGoal] || QUESTION_BANK[state.goal] || QUESTION_BANK.frontend || [];
    
    // If there are more than 30 questions for a goal, randomly shuffle and slice the top 30
    const shuffled = [...goalQuestions].sort(() => 0.5 - Math.random());
    state.questions = shuffled.slice(0, 30);
    
    renderQuestion();
}

function escapeHTML(str) {
    return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderQuestion() {
    var container = document.getElementById("assessment-container");
    var idx = Object.keys(state.answers).length;
    var total = state.questions.length;

    if (idx >= total) {
        showResults();
        return;
    }

    var q = state.questions[idx];
    document.getElementById("question-counter").textContent = "Question " + (idx + 1) + " of " + total;
    var correctCount = Object.values(state.answers).filter(a => a.correct).length;
    document.getElementById("score-live").textContent = "Score: " + correctCount + "/" + idx;

    container.innerHTML = `
        <div class="mb-4">
            <span class="text-[10px] font-bold text-tertiary uppercase tracking-widest">${escapeHTML(q.technology)}</span>
            <h3 class="text-lg font-bold mt-1">${escapeHTML(q.q)}</h3>
        </div>
        <div class="flex flex-col gap-3">
            ${q.options.map((opt, i) => `
                <button data-idx="${i}" class="step-card text-left p-4 rounded-xl border-2 border-outline-variant/40 bg-surface-container-lowest hover:border-primary-container transition-all text-sm">${escapeHTML(opt)}</button>
            `).join("")}
        </div>
    `;

    container.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", function() {
            var answerIdx = parseInt(btn.dataset.idx);
            state.answers[idx] = { answer: answerIdx, correct: answerIdx === q.answer };

            container.querySelectorAll("button").forEach((b, i) => {
                b.disabled = true;
                if (i === q.answer) b.classList.add("selected");
                else if (i === answerIdx && answerIdx !== q.answer) {
                    b.style.borderColor = "#ba1a1a";
                    b.style.backgroundColor = "#ffdad6";
                }
            });

            setTimeout(() => renderQuestion(), 800);
        });
    });
}

function showResults() {
    document.getElementById("step-4").classList.add("hidden");
    document.getElementById("step-results").classList.remove("hidden");
    document.getElementById("nav-buttons").classList.add("hidden");
    document.getElementById('wizard-title').textContent = 'Assessment Completed!';
    document.getElementById('wizard-subtitle').textContent = 'Review your scores and save your profile.';

    var techScores = {};
    var techCounts = {};
    state.questions.forEach((q, idx) => {
        if (!techScores[q.technology]) { techScores[q.technology] = 0; techCounts[q.technology] = 0; }
        techCounts[q.technology]++;
        if (state.answers[idx] && state.answers[idx].correct) techScores[q.technology]++;
    });

    var scores = {};
    var totalCorrect = 0, totalQuestions = 0;
    Object.keys(techScores).forEach(tech => {
        scores[tech] = Math.round((techScores[tech] / techCounts[tech]) * 100);
        totalCorrect += techScores[tech];
        totalQuestions += techCounts[tech];
    });

    var totalScore = Math.round((totalCorrect / Math.max(totalQuestions, 1)) * 100);
    state.scores = scores;
    state.totalScore = totalScore;

    var container = document.getElementById('step-results');
    container.innerHTML = `
        <div class="text-center mb-6">
            <span class="material-symbols-outlined text-primary text-5xl mb-2">emoji_events</span>
            <h2 class="text-2xl font-extrabold text-on-surface">Quiz Complete!</h2>
            <p class="text-on-surface-variant text-sm mt-1">Here is your verified skill breakdown.</p>
        </div>
        <div class="bg-surface-container-lowest rounded-2xl p-6 border border-outline-variant/30 mb-6 shadow-sm">
            <div class="text-center">
                <span class="text-5xl font-extrabold text-primary">${totalScore}%</span>
                <p class="text-sm font-semibold text-on-surface-variant mt-1">Overall Assessment Score</p>
            </div>
        </div>
        <div class="space-y-3 mb-8">
            ${Object.entries(scores).map(([tech, score]) => `
                <div class="flex items-center justify-between p-3.5 bg-surface-container-low rounded-xl border border-outline-variant/20">
                    <span class="font-bold text-sm text-on-surface">${tech}</span>
                    <div class="flex items-center gap-3">
                        <div class="w-32 h-2.5 bg-outline-variant/30 rounded-full overflow-hidden">
                            <div class="h-full bg-primary-container rounded-full transition-all" style="width: ${score}%"></div>
                        </div>
                        <span class="text-sm font-extrabold text-on-surface-variant w-10 text-right">${score}%</span>
                    </div>
                </div>
            `).join('')}
        </div>
        <div id="save-status-box" class="hidden p-4 rounded-xl bg-surface-container-low border border-primary/30 text-center mb-6">
            <div class="inline-block w-6 h-6 border-2 border-primary border-t-transparent rounded-full animate-spin mb-2"></div>
            <p id="save-status-text" class="text-xs font-bold text-primary uppercase tracking-wider">Saving profile...</p>
        </div>
        <div class="text-center">
            <button onclick="saveProfile()" class="btn-primary inline-flex items-center justify-center gap-2 px-8 py-3.5 text-sm shadow-md" id="save-btn">
                <span class="material-symbols-outlined text-lg">save</span>
                Save Profile
            </button>
        </div>
    `;
}

async function saveProfile() {
    var btn = document.getElementById('save-btn');
    var statusBox = document.getElementById('save-status-box');
    var statusText = document.getElementById('save-status-text');

    if (btn) btn.classList.add('hidden');
    if (statusBox) statusBox.classList.remove('hidden');

    var session = await getSessionWithRetry();
    if (!session) { window.location.href = 'login_register.html'; return; }

    try {
        if (statusText) statusText.textContent = '1/2 Saving your verified profile to Supabase...';

        const profileData = {
            user_id: session.user.id,
            industry: state.industry,
            goal: state.goal,
            technologies: state.technologies,
            scores: state.scores,
            total_score: state.totalScore,
            completed_at: new Date().toISOString()
        };

        // ZERO-LATENCY LOCAL CACHE: Save full profile payload immediately
        localStorage.setItem('mindurr_skill_profile', JSON.stringify(profileData));
        localStorage.setItem('mindurr_has_profile', 'true');

        // 1. Save profile directly to Supabase skill_profiles
        let savedProfile = null;
        try {
            savedProfile = await saveSkillProfileToSupabase(profileData);
            if (savedProfile) {
                localStorage.setItem('mindurr_skill_profile', JSON.stringify(savedProfile));
            }
        } catch (dbErr) {
            console.warn('Direct skill_profiles upsert note:', dbErr);
        }

        if (statusText) statusText.textContent = '2/2 Analyzing gaps & generating personalized roadmap...';

        // 2. Generate and save personalized 4-phase learning roadmap directly to Supabase
        try {
            await generateAndSaveRoadmapToSupabase({
                ...profileData,
                id: savedProfile ? savedProfile.id : null
            });
        } catch (roadmapErr) {
            console.warn('Roadmap save note:', roadmapErr);
        }

        showToast('Profile & Learning Roadmap saved!', 'success');
        setTimeout(() => window.location.href = 'profile.html', 700);
    } catch (err) {
        console.error("Profile save error:", err);
        localStorage.setItem('mindurr_has_profile', 'true');
        showToast('Profile ready! Redirecting to dashboard...', 'info');
        setTimeout(() => window.location.href = 'profile.html', 800);
    }
}

function goToStep(step) {
    document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
    document.getElementById('step-' + step).classList.remove('hidden');

    var titles = {
        1: ['What is your motivation?', 'Tell us why you are taking this assessment.'],
        2: ['Select Your Goal', 'Choose the role you want to focus on.'],
        3: ['Select Technologies', 'Choose the frameworks and tools you currently know.'],
        4: ['Take Assessment', 'Answer questions about your selected technologies.']
    };

    document.getElementById('wizard-title').textContent = titles[step][0];
    document.getElementById('wizard-subtitle').textContent = titles[step][1];
    document.getElementById('progress-bar').style.width = (step * 25) + '%';

    document.getElementById('prev-btn').classList.toggle('hidden', step === 1);
    document.getElementById('next-btn').disabled = true;
    document.getElementById('next-btn').textContent = 'Next';

    if (step === 3) {
        document.getElementById('next-btn').textContent = 'Start Assessment';
    } else if (step === 4) {
        document.getElementById('nav-buttons').classList.add('hidden');
    } else {
        document.getElementById('nav-buttons').classList.remove('hidden');
    }
}

document.getElementById('next-btn').addEventListener('click', function() {
    if (state.step === 1 && !state.industry) { showToast('Please select a motivation', 'error'); return; }
    if (state.step === 2 && !state.goal) { showToast('Please select a goal', 'error'); return; }
    if (state.step === 3 && state.technologies.length === 0) { showToast('Please select at least one technology', 'error'); return; }

    if (state.step === 1) { state.step = 2; renderGoals(); }
    else if (state.step === 2) { state.step = 3; renderTechnologies(); }
    else if (state.step === 3) { state.step = 4; loadHardcodedQuestions(); }
    goToStep(state.step);
});

document.getElementById('prev-btn').addEventListener('click', function() {
    state.step--;
    goToStep(state.step);
    
    if (state.step === 1) document.getElementById('next-btn').disabled = !state.industry;
    else if (state.step === 2) document.getElementById('next-btn').disabled = !state.goal;
    else if (state.step === 3) document.getElementById('next-btn').disabled = state.technologies.length === 0;
});

async function init() {
    var authInfo = await getAuthenticatedProfile();
    if (!authInfo) return;

    if (authInfo.role === 'recruiter') {
        window.location.href = 'recruiter_dashboard.html';
        return;
    }

    var emailEl = document.getElementById('user-email-header');
    if (emailEl && authInfo.user) emailEl.textContent = authInfo.user.email;

    try {
        var profile = (await supabaseClient.from('skill_profiles').select('id, total_score').eq('user_id', authInfo.user.id).maybeSingle()).data;
        if (profile) {
            var banner = document.getElementById('existing-profile-banner');
            if (banner) banner.classList.remove('hidden');
            localStorage.setItem('mindurr_has_profile', 'true');
        }
    } catch (e) {
        console.warn('Could not check existing profile:', e);
    }
}

renderIndustries();
init();
</script>
</body>
</html>
