<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Mindurr.ai | Candidate Benchmark Profile</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: "#fefce8",
                        "surface-card": "#fffdf2",
                        primary: "#eab308",
                        "primary-dark": "#ca8a04",
                        "on-surface": "#1c1917",
                        "inverse-surface": "#313124",
                        "border-subtle": "#d6d3d1"
                    },
                    fontFamily: {
                        heading: ["Geist", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --surface: #fefce8;
            --primary: #eab308;
            --on-surface: #1c1917;
            --inverse-surface: #313124;
            --border-subtle: #d6d3d1;
            --font-heading: 'Geist', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        body {
            background-color: #fefce8;
            color: #1c1917;
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Geist', sans-serif;
        }
        .glass-card {
            background-color: #fffdf2;
            border: 1px solid #d6d3d1;
            box-shadow: 0 4px 16px -2px rgba(28, 25, 23, 0.05);
            border-radius: 1rem;
        }
    </style>
</head>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full border-b border-border-subtle bg-surface/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <a class="flex items-center gap-3" href="recruiter_dashboard.html">
                <div class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" style="display: block;">
                        <path d="M4 19L9 5L12 12L15 5L20 19" fill="none" stroke="#422006" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="9" cy="5" r="2" fill="#fffdf2" stroke="#422006" stroke-width="1.5"/>
                        <circle cx="15" cy="5" r="2" fill="#fffdf2" stroke="#422006" stroke-width="1.5"/>
                        <circle cx="12" cy="12" r="2" fill="#fffdf2" stroke="#422006" stroke-width="1.5"/>
                        <circle cx="4" cy="19" r="1.8" fill="#fffdf2" stroke="#422006" stroke-width="1.5"/>
                        <circle cx="20" cy="19" r="1.8" fill="#fffdf2" stroke="#422006" stroke-width="1.5"/>
                    </svg>
                </div>
                <span class="font-heading font-extrabold text-xl tracking-tight text-on-surface">Mindurr<span class="text-primary font-black">.ai</span></span>
            </a>
            
            <div class="flex items-center gap-4">
                <a href="recruiter_dashboard.html" class="text-xs font-bold uppercase tracking-wider text-stone-700 hover:text-black flex items-center gap-1">
                    <span class="material-symbols-outlined text-base">arrow_back</span>
                    Dashboard
                </a>
                <button onclick="logout()" class="text-xs font-bold uppercase tracking-wider bg-inverse-surface hover:bg-black text-white px-4 py-2 rounded-xl transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Body -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10">
        <div id="candidate-content">
            <div class="text-center py-16">
                <div class="inline-block w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs font-semibold text-stone-600 mt-4">Loading candidate scorecard...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-border-subtle/60 py-4 text-center text-xs text-stone-500">
        Mindurr.ai &copy; 2026 Solaris Systems. All benchmarks verified.
    </footer>

    <script src="vendor/supabase.js"></script>
    <script src="config.js"></script>
    <script>
    async function loadCandidate() {
        const authInfo = await getAuthenticatedProfile();
        if (!authInfo) return;

        const params = new URLSearchParams(window.location.search);
        const candidateId = params.get('id');
        const candidateName = params.get('name') || 'Candidate';
        const candidateGoal = params.get('goal') || 'Engineering Track';

        const container = document.getElementById('candidate-content');

        try {
            let profileData = null;

            if (supabaseClient && candidateId) {
                const { data, error } = await supabaseClient
                    .from('skill_profiles')
                    .select('*')
                    .eq('id', candidateId)
                    .maybeSingle();

                if (!error && data) {
                    profileData = data;
                }
            }

            // Fallback if not found in db or viewing sample
            if (!profileData) {
                profileData = {
                    id: candidateId || "CAN-7719",
                    skill_goal: candidateGoal,
                    total_score: 89,
                    percentile: 94,
                    scores: {
                        "Core Architecture": 92,
                        "API Design & Contracts": 88,
                        "Performance & Concurrency": 86,
                        "Security & Auth Principles": 90
                    }
                };
            }

            const score = Math.round(profileData.total_score || 85);
            const percentile = profileData.percentile || Math.min(99, Math.round(score * 1.08));
            const scores = profileData.scores || {};

            container.innerHTML = `
                <div class="glass-card p-8 mb-6 border-2 border-primary/30">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary/20 text-[#854d0e] border border-primary/40 text-xs font-bold uppercase tracking-wider mb-3">
                                <span class="material-symbols-outlined text-sm">verified</span>
                                Verified Skill Profile
                            </div>
                            <h1 class="font-heading text-3xl font-extrabold text-on-surface">${candidateName}</h1>
                            <p class="text-stone-600 text-sm mt-1">${profileData.skill_goal || candidateGoal} Specialist</p>
                            <p class="text-xs text-stone-500 font-mono mt-1">ID: ${profileData.id || candidateId}</p>
                        </div>
                        <div class="text-center bg-yellow-100/70 border border-yellow-300 p-4 rounded-2xl shrink-0">
                            <span class="text-5xl font-black text-amber-600 leading-none">${score}%</span>
                            <p class="text-[10px] font-bold uppercase tracking-wider text-amber-900 mt-1">Benchmark Score</p>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-8 mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-heading font-bold text-sm uppercase tracking-wider text-stone-700">Overall Percentile Rank</span>
                        <span class="text-emerald-700 font-bold text-sm">${percentile}th Percentile</span>
                    </div>
                    <div class="w-full h-3 bg-stone-200 rounded-full overflow-hidden mb-2">
                        <div class="h-full bg-primary rounded-full" style="width: ${percentile}%"></div>
                    </div>
                    <p class="text-xs text-stone-500">Outperforms ${percentile}% of tested engineers across core syllabus competencies.</p>
                </div>

                <div class="glass-card p-8">
                    <h2 class="font-heading text-xl font-bold mb-4 text-on-surface">Domain Assessment Scores</h2>
                    <div class="space-y-4">
                        ${Object.entries(scores).map(([category, val]) => `
                            <div class="flex items-center justify-between p-3.5 bg-[#fefce8] border border-border-subtle/80 rounded-xl">
                                <span class="font-medium text-sm text-stone-800">${category}</span>
                                <div class="flex items-center gap-3">
                                    <div class="w-36 sm:w-48 h-2 bg-stone-200 rounded-full overflow-hidden">
                                        <div class="h-full bg-primary rounded-full" style="width: ${val}%"></div>
                                    </div>
                                    <span class="font-mono text-sm font-bold w-12 text-right">${val}%</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="flex items-center justify-between mt-8">
                    <a href="recruiter_dashboard.html" class="text-xs font-bold uppercase tracking-wider text-[#854d0e] hover:underline flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">arrow_back</span>
                        Back to candidate pool
                    </a>
                    <a href="mailto:talent@mindurr.ai?subject=Interview%20Request%20for%20${encodeURIComponent(candidateName)}" class="px-6 py-3 bg-inverse-surface hover:bg-black text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-sm transition flex items-center gap-2">
                        <span class="material-symbols-outlined text-base">mail</span>
                        Request Interview
                    </a>
                </div>
            `;
        } catch (err) {
            console.error("Load candidate error:", err);
            container.innerHTML = '<div class="text-center py-16 text-rose-600 font-bold">Failed to load candidate profile.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', loadCandidate);
    </script>
</body>
</html>
